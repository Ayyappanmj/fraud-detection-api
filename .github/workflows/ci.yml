name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train model and run evaluation gate (synthetic data)
        run: python -m src.train --out-dir models --min-pr-auc 0.10
      - name: Run tests
        run: pytest -v
      - name: Upload model artifacts (small, synthetic)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/metadata.json
            models/metrics.json
            models/reference_stats.json
            models/model.joblib
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t fraud-api:ci -f Dockerfile .
      - name: Build dashboard image
        run: docker build -t fraud-dashboard:ci -f Dockerfile.dashboard .
